name: Prototype Pharmacognosy Reference Style

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "Repository-relative DOCX path (for example Incoming/Marketing_Principles.docx)"
        required: true
        type: string
        default: "Incoming/Marketing_Principles.docx"

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v5

      - name: Install LibreOffice and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install document dependency
        run: python -m pip install --upgrade pip "python-docx>=1.1,<2"

      - name: Validate input and create isolated mockup
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          test -f "$SOURCE_PATH"
          case "$SOURCE_PATH" in
            *.docx) ;;
            *) echo "Only .docx inputs are supported by this prototype"; exit 1 ;;
          esac
          python scripts/prototype_reference_style.py --input "$SOURCE_PATH" --output-dir prototype-output

      - name: Upload mockup for visual review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reference-style-mockup
          path: |
            prototype-output/*.docx
            prototype-output/*.pdf
            prototype-output/*.png
          if-no-files-found: error
          retention-days: 14
