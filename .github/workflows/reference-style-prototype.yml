name: Analytical Chemistry reference-style prototype # pagination import fix validation
on:
  push:
    branches:
      - "prototype/reference-exam-workflow"
    paths:
      - "*.doc"
      - "*.docx"
      - "!Analytical_Chemistry_I_Formatted.docx"
      - "Incoming/**/*.doc"
      - "Incoming/**/*.docx"
      - "workflow-prototype/format_reference_style.py"
  workflow_dispatch:
    inputs:
      file_path:
        description: "Repository path of the single exam to format (for manual runs)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: reference-style-prototype
  cancel-in-progress: false
jobs:
  analytical-chemistry-reference:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install LibreOffice and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install document dependency
        run: python -m pip install --upgrade pip "python-docx>=1.1,<2"
      - name: Generate Analytical Chemistry reference-style mockup
        run: python workflow-prototype/format_reference_style.py --input "Analytical_Chemistry_I_Formatted.docx" --reference "Analytical_Chemistry_I_Formatted.docx" --output-prefix "Analytical_Chemistry_Reference_Style"
      - name: Render every page for visual inspection
        run: |
          mkdir -p workflow-prototype/output/previews/analytical-chemistry
          pdfinfo workflow-prototype/output/Analytical_Chemistry_Reference_Style.pdf
          pdftoppm -png -r 120 workflow-prototype/output/Analytical_Chemistry_Reference_Style.pdf workflow-prototype/output/previews/analytical-chemistry/page
      - name: Upload Analytical Chemistry prototype
        uses: actions/upload-artifact@v5
        with:
          name: analytical-chemistry-reference-style-prototype
          path: workflow-prototype/output/Analytical_Chemistry_Reference_Style.*
          if-no-files-found: error
          retention-days: 14
  rehabilitation-engineering-reference:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install LibreOffice and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install document dependency
        run: python -m pip install --upgrade pip "python-docx>=1.1,<2"
      - name: Convert legacy DOC, then apply reference style
        run: python workflow-prototype/format_reference_style.py --input "Rehabilitation_Engineering_final exam.doc" --reference "Analytical_Chemistry_I_Formatted.docx" --output-prefix "Rehabilitation_Engineering_Reference_Style"
      - name: Render every page for visual inspection
        run: |
          mkdir -p workflow-prototype/output/previews/rehabilitation-engineering
          pdfinfo workflow-prototype/output/Rehabilitation_Engineering_Reference_Style.pdf
          pdftoppm -png -r 120 workflow-prototype/output/Rehabilitation_Engineering_Reference_Style.pdf workflow-prototype/output/previews/rehabilitation-engineering/page
      - name: Upload Rehabilitation Engineering prototype
        uses: actions/upload-artifact@v5
        with:
          name: rehabilitation-engineering-reference-style-prototype
          path: |
            workflow-prototype/output/Rehabilitation_Engineering_Reference_Style.docx
            workflow-prototype/output/Rehabilitation_Engineering_Reference_Style.pdf
            workflow-prototype/output/previews/rehabilitation-engineering/
          if-no-files-found: error
          retention-days: 14

  format-all-uploaded-exams:
    name: Format and email only the newly added exam
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install LibreOffice and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install document dependency
        run: python -m pip install --upgrade pip "python-docx>=1.1,<2"
      - name: Identify the single newly added exam
        id: selected_exam
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          MANUAL_FILE_PATH: ${{ inputs.file_path }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            selected="$MANUAL_FILE_PATH"
            if [[ -z "$selected" ]]; then
              echo "::error::Enter the repository path of one exam for a manual run."
              exit 1
            fi
          else
            if [[ "$EVENT_BEFORE" =~ ^0+$ ]]; then
              changed="$(git diff-tree --no-commit-id --name-only -r --diff-filter=AM "$EVENT_SHA")"
            else
              changed="$(git diff --name-only --diff-filter=AM "$EVENT_BEFORE" "$EVENT_SHA")"
            fi
            mapfile -t files < <(printf '%s\n' "$changed" | while IFS= read -r path; do
              case "$path" in
                *.doc|*.docx)
                  [[ "$path" == "Analytical_Chemistry_I_Formatted.docx" ]] || printf '%s\n' "$path"
                  ;;
              esac
            done)
            if [[ "${#files[@]}" -eq 0 ]]; then
              # A workflow-only repair commit re-tests the latest exam in Incoming.
              latest="$(git log -1 --format= --name-only --diff-filter=AM "$EVENT_SHA" -- Incoming | grep -Ei '\.(doc|docx)$' | head -n 1 || true)"
              if [[ -n "$latest" ]]; then files=("$latest"); fi
            fi
            if [[ "${#files[@]}" -eq 0 ]]; then
              echo "::error::No newly added or updated Word exam was found."
              exit 1
            fi
            selected="${files[-1]}"
            if [[ "${#files[@]}" -gt 1 ]]; then
              echo "::warning::Multiple exams changed; processing only: $selected"
            fi
          fi
          if [[ ! -f "$selected" ]]; then
            echo "::error::The selected exam does not exist: $selected"
            exit 1
          fi
          case "$selected" in *.doc|*.docx) ;; *) echo "::error::The selected file must be a .doc or .docx document."; exit 1 ;; esac
          echo "file_path=$selected" >> "$GITHUB_OUTPUT"
          echo "Selected exam: $selected" >> "$GITHUB_STEP_SUMMARY"
      - name: Format only the selected exam
        shell: bash
        env:
          INPUT_FILE: ${{ steps.selected_exam.outputs.file_path }}
        run: |
          set -euo pipefail
          rm -rf workflow-prototype/output
          mkdir -p workflow-prototype/output
          base="$(basename "$INPUT_FILE")"
          stem="${base%.*}"
          if [[ "$INPUT_FILE" == Incoming/* ]]; then stem="Incoming_$stem"; fi
          prefix="$(printf '%s' "$stem" | tr -cs '[:alnum:]_.-' '_')"
          echo "Formatting only: $INPUT_FILE"
          python workflow-prototype/format_reference_style.py \
            --input "$INPUT_FILE" \
            --reference "Analytical_Chemistry_I_Formatted.docx" \
            --output-prefix "$prefix"
      - name: Render first three pages of the selected exam
        if: always()
        run: |
          mkdir -p workflow-prototype/output/previews/uploaded
          for file in workflow-prototype/output/*.pdf; do
            [ -f "$file" ] || continue
            name="$(basename "$file" .pdf)"
            pdftoppm -f 1 -l 3 -png -r 110 "$file" "workflow-prototype/output/previews/uploaded/$name-page" || true
          done
      - name: Upload the single formatted exam
        id: upload_exams
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: formatted-exams-download
          path: |
            workflow-prototype/output/*.docx
            workflow-prototype/output/*.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Publish download instructions
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload_exams.outputs.artifact-url }}
        run: |
          {
            echo "# Your formatted exam is ready"
            echo
            echo "## [Download the formatted exam (Word + PDF)]($ARTIFACT_URL)"
            echo
            echo "The ZIP contains only the selected exam in editable Word and print-ready PDF formats."
            echo "Files are available for 30 days."
            echo "[Open this workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Email only the selected formatted exam
        if: success()
        shell: bash
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: Alhassan@taibah.edu.sd
        run: |
          set -euo pipefail
          if [[ -z "$SMTP_USERNAME" || -z "$SMTP_PASSWORD" ]]; then
            echo "::notice::Email skipped because SMTP credentials are not configured."
            exit 0
          fi
          python - <<'PY'
          import glob, mimetypes, os, smtplib, ssl
          from email.message import EmailMessage
          from pathlib import Path

          files = sorted(glob.glob("workflow-prototype/output/*.docx") +
                         glob.glob("workflow-prototype/output/*.pdf"))
          if len(files) != 2:
              raise SystemExit(f"Expected exactly one Word and one PDF output; found {len(files)} files.")
          message = EmailMessage()
          message["Subject"] = "Your formatted examination is ready"
          message["From"] = os.environ.get("SMTP_FROM") or os.environ["SMTP_USERNAME"]
          message["To"] = os.environ["EMAIL_TO"]
          message.set_content(
              "Your examination has been formatted. The editable Word document "
              "and print-ready PDF are attached."
          )
          for filename in files:
              path = Path(filename)
              content_type, _ = mimetypes.guess_type(path.name)
              maintype, subtype = (content_type or "application/octet-stream").split("/", 1)
              message.add_attachment(path.read_bytes(), maintype=maintype,
                                     subtype=subtype, filename=path.name)
          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as server:
              server.ehlo()
              server.starttls(context=ssl.create_default_context())
              server.ehlo()
              server.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
              server.send_message(message)
          print(f"Successfully emailed exactly one exam (2 files) to {os.environ['EMAIL_TO']}.")
          PY
