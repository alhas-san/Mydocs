name: Format exam documents

on:
  workflow_dispatch:
  push:
    paths:
      - "*.doc"
      - "*.docx"
      - "Incoming/*.doc"
      - "Incoming/*.docx"
      - "scripts/format_exams.py"
      - "scripts/review_exam_documents.py"
      - "tests/**"
      - ".github/workflows/format-exams.yml"

permissions:
  contents: write
concurrency:
  group: exam-document-formatting
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LibreOffice and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip "python-docx>=1.1,<2"

      - name: Run formatter unit tests
        run: python -m unittest discover -s tests -v

      - name: Format, validate and report
        run: python scripts/format_exams.py

      - name: Create visual review previews
        if: always()
        run: |
          mkdir -p Formatted/previews
          for file in Formatted/*.pdf; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .pdf)
            pdftoppm -f 1 -l 3 -png -r 110 "$file" "Formatted/previews/$name-page" || true
          done

      - name: Upload formatted documents and previews for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: formatted-exam-review
          path: |
            Formatted/*.docx
            Formatted/*.pdf
            Formatted/processing_report.*
            Formatted/previews/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Commit formatted documents and reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formatted/
          if ! git diff --cached --quiet; then
            git commit -m "Apply professional exam formatting profile"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "No new formatted documents or reports."
          fi

  review:
    name: Automated PDF quality review
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out formatted documents
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install review dependencies
        run: python -m pip install --upgrade pip "PyMuPDF>=1.24,<2" "python-docx>=1.1,<2" "Pillow>=10,<13"

      - name: Review every formatted PDF page
        run: python scripts/review_exam_documents.py

      - name: Upload complete review package
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rehabilitation-exam-automated-review
          path: |
            Formatted/review/review_report.md
            Formatted/review/review_report.json
            Formatted/review/index.html
            Formatted/review/*-contact-sheet.jpg
            Formatted/review/*/page-*.png
          if-no-files-found: warn
          retention-days: 30
