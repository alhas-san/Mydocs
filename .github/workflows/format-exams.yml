name: Format exam documents

on:
  workflow_dispatch:
  push:
    paths:
      - "*.doc"
      - "*.docx"
      - "Incoming/*.doc"
      - "Incoming/*.docx"
      - "scripts/format_exams.py"
      - ".github/workflows/format-exams.yml"

permissions:
  contents: write

concurrency:
  group: exam-document-formatting
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LibreOffice and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip "python-docx>=1.1,<2"

      - name: Format, validate and report
        run: python scripts/format_exams.py

      - name: Commit formatted documents and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formatted/
          if ! git diff --cached --quiet; then
            git commit -m "Format and validate exam documents"
            git pull --rebase origin main
            git push
          else
            echo "No new formatted documents or reports."
          fi
